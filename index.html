<style>
  :root{
    --blue:#2b4bf2; --blue-dark:#1a2fb0; --ink:#14172b; --muted:#5b6178;
    --bg:#f2f4fb; --card:#ffffff; --green:#1e9e5a; --red:#d64545; --line:#e3e7f4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,#eef1fb 0%,#f7f8fd 60%,#eef3ff 100%);
    color:var(--ink); min-height:100vh; padding:24px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  header{margin-bottom:22px;}
  .tag{display:inline-block; background:var(--blue); color:#fff; font-size:13px;
       font-weight:600; padding:5px 14px; border-radius:999px; letter-spacing:.4px;}
  h1{font-size:clamp(24px,4vw,34px); line-height:1.2; margin-top:12px;}
  .sub{color:var(--muted); margin-top:6px; font-size:15px;}
  .progress{height:8px; background:#dde3f5; border-radius:99px; overflow:hidden; margin:18px 0;}
  .progress i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--blue),#6d8cff);
              border-radius:99px; transition:width .4s ease;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:28px 28px 24px; box-shadow:0 10px 30px rgba(26,47,176,.07);}
  .qnum{color:var(--blue); font-weight:700; font-size:13px; letter-spacing:.5px; text-transform:uppercase;}
  h2{font-size:20px; line-height:1.45; margin:8px 0 18px;}
  .imgbox{border-radius:12px; overflow:hidden; border:1px solid var(--line);
          margin-bottom:18px; background:#0d0f14;}
  .imgbox img{width:100%; display:block;}
  .imgcap{font-size:13px; color:var(--muted); padding:8px 12px; background:#f7f8fc;
          border-top:1px solid var(--line); font-style:italic;}
  .opt{display:block; width:100%; text-align:left; background:#f7f8fd; border:1.5px solid var(--line);
       border-radius:12px; padding:14px 16px; margin-bottom:10px; font-size:16px; cursor:pointer;
       transition:all .18s ease; font-family:inherit; color:var(--ink); line-height:1.4;}
  .opt:hover:not(:disabled){border-color:var(--blue); background:#f0f3ff; transform:translateX(3px);}
  .opt:disabled{cursor:default; opacity:.85;}
  .opt.correct{border-color:var(--green); background:#eaf8f0; color:#12693c; font-weight:600; opacity:1;}
  .opt.wrong{border-color:var(--red); background:#fdf0f0; color:#9c2b2b; font-weight:600;}
  .expl{display:none; margin-top:14px; background:#f3f6ff; border-left:4px solid var(--blue);
        border-radius:0 10px 10px 0; padding:14px 16px; font-size:15px; line-height:1.55; color:#2a2f4a;}
  .expl.show{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .verdict{font-weight:700; margin-bottom:6px;}
  .verdict.ok{color:var(--green);} .verdict.no{color:var(--red);}
  .btn{display:inline-block; background:var(--blue); color:#fff; border:none; font-family:inherit;
       font-size:16px; font-weight:600; padding:13px 30px; border-radius:12px; cursor:pointer;
       margin-top:20px; transition:background .2s;}
  .btn:hover{background:var(--blue-dark);}
  .btn.ghost{background:transparent; color:var(--blue); border:1.5px solid var(--blue);}
  .hidden{display:none;}
  .score-big{font-size:44px; font-weight:800; color:var(--blue); margin:8px 0;}
  .final{background:#f7f8fd; border:1px solid var(--line); border-radius:14px;
         padding:18px; margin-top:20px; font-size:14.5px; color:var(--muted); line-height:1.55;}
  footer{margin-top:26px; text-align:center; color:var(--muted); font-size:13px;}
</style>

let current = 0, score = 0;
const quiz = document.getElementById('quiz');
const bar = document.getElementById('bar');

function render(){
  bar.style.width = (current / QUESTIONS.length * 100) + '%';
  const q = QUESTIONS[current];
  let html = `<div class="qnum">Вопрос ${current+1} из ${QUESTIONS.length} · ` +
             (q.type === "image" ? "вопрос с иллюстрацией" : "персоналии") + `</div>
              <h2>${q.q}</h2>`;
  if(q.img){
    html += `<div class="imgbox"><img src="${q.img}" alt="иллюстрация из лекции">
             <div class="imgcap">${q.cap}</div></div>`;
  }
  html += `<div id="opts">` + q.options.map((o,i)=>
    `<button class="opt" data-i="${i}" onclick="answer(${i})">${String.fromCharCode(1072+i)}) ${o}</button>`
  ).join('') + `</div>
  <div class="expl" id="expl">
    <div class="verdict" id="verdict"></div>
    <div>${q.expl}</div>
    <button class="btn" id="next" onclick="next()">${current === QUESTIONS.length-1 ? "Показать результат" : "Следующий вопрос"}</button>
  </div>`;
  quiz.innerHTML = html;
}

function answer(i){
  const q = QUESTIONS[current];
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled = true;
    const idx = +b.dataset.i;
    if(idx === q.correct) b.classList.add('correct');
    else if(idx === i) b.classList.add('wrong');
  });
  const v = document.getElementById('verdict');
  if(i === q.correct){ score++; v.textContent = '✔ Верно!'; v.className = 'verdict ok'; }
  else { v.textContent = '✘ Неверно. Правильный ответ: ' + String.fromCharCode(1072+q.correct) + ')'; v.className = 'verdict no'; }
  document.getElementById('expl').classList.add('show');
}

function next(){
  current++;
  if(current < QUESTIONS.length) render();
  else final();
}

function final(){
  bar.style.width = '100%';
  let msg;
  if(score === 5) msg = 'Блестяще! Лекция усвоена от РУЦИ до голограмм Денисюка.';
  else if(score >= 4) msg = 'Отличный результат — вы уверенно знаете историю университета.';
  else if(score >= 3) msg = 'Хорошо, но стоит пересмотреть пару слайдов презентации.';
  else msg = 'Стоит вернуться к лекции: почти все ответы — в её слайдах.';
  quiz.innerHTML = `<div class="qnum">Результат</div>
    <div class="score-big">${score} / 5</div>
    <p style="font-size:17px;">${msg}</p>
    <div class="final">Состав квиза по заданию модуля: 3 вопроса посвящены персоналиям учёных Университета ИТМО
    (Н. Б. Завадский, С. И. Вавилов, Ю. Н. Денисюк), 2 вопроса построены на иллюстрациях из презентации лекции —
    часах, собранных учеником механ.-оптич. отделения РУЦИ, и машине «ЛИТМО-1». К каждому вопросу приведён
    правильный ответ и пояснение с изложением фактов лекции.</div>
    <button class="btn ghost" onclick="restart()">Пройти заново</button>`;
}

function restart(){ current = 0; score = 0; render(); }
render();
</script>
